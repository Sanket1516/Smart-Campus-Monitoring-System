gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 256;

# Plain HTTP (laptop / desktop use)
server {
    listen 80;
    server_name localhost;
    include /etc/nginx/conf.d/app-locations.inc;
}

# HTTPS for phones: browsers only allow the camera over HTTPS.
# Certificate files come from frontend/certs (created by `npm run setup:lan-https`) and are mounted read-only.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/lan.pem;
    ssl_certificate_key /etc/nginx/certs/lan-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/app-locations.inc;
}
