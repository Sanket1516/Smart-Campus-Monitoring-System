<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Sentinel — biometric campus security: central enrolment, dedicated entry and exit terminals, real-time monitoring." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Sentinel · Smart Campus Security</title>
    <script>
      // Dark command-centre theme by default; respect a saved light choice (set before first paint).
      (function () {
        var light = false;
        try {
          light = localStorage.getItem('smart-campus-theme') === 'light';
        } catch (e) {}
        if (!light) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
